buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        gradlePluginPortal()
        maven { url="https://repository.apache.org/content/repositories/releases/" }
        maven { url="https://repo.grails.org/grails/core" }
    }
    dependencies {
        classpath "org.apache.grails:grails-gradle-plugins:$grailsVersion"
//        classpath "cloud.wondrify:asset-pipeline-gradle:5.1.0-M1"


    }
}

version="0.1.3"
group="org.grails.plugins"


apply plugin:"eclipse"
apply plugin:"idea"
apply plugin: "org.apache.grails.gradle.grails-plugin"
apply plugin:"org.apache.grails.gradle.grails-gsp"
//apply plugin: "org.ysb33r.webdriver-binaries"

repositories {
    mavenLocal()
    mavenCentral()
    gradlePluginPortal()
    maven { url="https://repository.apache.org/content/repositories/releases/" }
    maven { url="https://repo.grails.org/grails/core" }
}

dependencies {
//    implementation "org.springframework.boot:spring-boot-starter-logging"
//    implementation  "org.springframework.boot:spring-boot-autoconfigure"
    implementation platform("org.apache.grails:grails-bom:$grailsVersion")
    compileOnly "org.apache.grails:grails-core"
//    implementation "org.springframework.boot:spring-boot-starter-actuator"
    compileOnly "org.springframework.boot:spring-boot-starter-tomcat"


    implementation "org.apache.grails:grails-dependencies-starter-web"
    compileOnly "org.apache.grails:grails-web-boot"
    compileOnly "org.apache.grails:grails-gsp"
    implementation "cloud.wondrify:asset-pipeline-gradle:5.1.0-M1"
    implementation "org.apache.grails:grails-cache"
    implementation "org.apache.grails.data:grails-datamapping-core"
    profile "org.apache.grails.profiles:web-plugin"
    compileOnly "org.apache.grails:grails-services"
    implementation "org.apache.grails:grails-data-hibernate5-spring-boot:7.0.7"
    implementation "org.apache.grails.data:grails-datamapping-support"
    implementation "org.apache.grails.data:grails-data-hibernate5-core:7.0.7"
    implementation "org.apache.grails:grails-domain-class"
    runtimeOnly "cloud.wondrify:asset-pipeline-gradle:5.1.0-M1"
//    runtimeOnly 'com.h2database:h2'

}
grails {
    springDependencyManagement = false
}
